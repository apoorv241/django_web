
name: Django Docker CI

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Download repository code
      - name: Checkout code
        uses: actions/checkout@v6

      # Create temporary CI environment
      - name: Create environment variables
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=military_buff_db
          POSTGRES_USER=military_user
          POSTGRES_PASSWORD=ci_test_password
          DJANGO_SECRET_KEY=ci-only-secret-key-not-for-production
          DJANGO_DEBUG=False
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          EOF

      # Required because your Compose volume is external
      - name: Create PostgreSQL volume
        run: docker volume create military_buff_pgdata

      # Validate Docker Compose file
      - name: Validate Compose
        run: docker compose config --quiet

      # Build Django Docker image
      - name: Build Django image
        run: docker compose build web

      # Start PostgreSQL container
      - name: Start PostgreSQL
        run: docker compose up -d --wait db

      # Check Django configuration
      - name: Django system check
        run: |
          docker compose run --rm -T web \
            python manage.py check

      # Validate migrations
      - name: Check migrations
        run: |
          docker compose run --rm -T web \
            python manage.py makemigrations --check --dry-run

      # Create database tables
      - name: Run migrations
        run: |
          docker compose run --rm -T web \
            python manage.py migrate --noinput

      # Run Django tests
      - name: Run tests
        run: |
          docker compose run --rm -T web \
            python manage.py test --noinput

      # Show logs if something fails
      - name: Show Docker logs
        if: failure()
        run: docker compose logs --tail=100

      # Stop containers after testing
      - name: Cleanup
        if: always()
        run: docker compose down


  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    concurrency:
      group: django-production
      cancel-in-progress: false

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Deploy to EC2
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "{\"commands\":[\"runuser -u ec2-user -- /bin/bash /home/ec2-user/django_web/scripts/deploy.sh $GITHUB_SHA\"]}" \
            --query 'Command.CommandId' \
            --output text)

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json || true
            exit 1
          fi

          echo "Deployment successful"

